name: Python tests

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev,audio,m4,midi]"
      - name: Run test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Smoke-test CLI
        run: reawarp --duration 5 --sample-rate 22050 --seed 211 --output /tmp/reawarp-ci
      - name: Smoke-test desktop entry point
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -c "from reawarp.ui.main_window import MainWindow; print('Reawarp UI import OK')"
