name: Python regression and smoke checks

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install OpenGL EGL runtime for PySide6
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1
      - name: Install package and quality dependencies
        run: python -m pip install -e ".[dev,audio,m4,midi]"
      - name: Compile application package
        run: python -m compileall -q src/reawarp
      - name: Run full regression suite
        run: python -m pytest -q
      - name: Validate IRO sample catalog and phrase grammar
        run: |
          python - <<'PY'
          from reawarp.samples.iro import load_drum_assets, load_entity_assets, load_sound_fx_assets, load_sound_lab_assets, verify_iro_assets
          drums = load_drum_assets()
          entities = load_entity_assets()
          sound_fx = load_sound_fx_assets()
          sound_lab = load_sound_lab_assets()
          assert drums and entities and sound_fx and sound_lab
          report = verify_iro_assets()
          assert report["ok"], report
          assert report["available"] + len(report["missing"]) == report["total"]
          assert len(drums) == 96
          assert len({item.family for item in entities}) >= 8
          print(f"IRO catalog OK · {len(drums)} generated drum entries ({sum(item.available for item in drums)} WAVs present) · {len(entities)} entities · {len(sound_fx)} FX events/loops · {len(sound_lab)} sound-lab assets · {report['verified']} hashes verified · {len(report['missing'])} WAVs absent")
          PY
      - name: Run short benchmark fixture
        run: python scripts/benchmark_generation.py --durations 5 --palettes subtractive --sample-rate 22050 --output /tmp/reawarp-m14-benchmark.json
      - name: Benchmark portable M24.1 convolution reference
        run: python scripts/benchmark_m24_convolution.py --durations 0.15 --ir-durations 0.05 --sample-rates 22050 --output /tmp/reawarp-m24-1-benchmark.json
      - name: Render M24.1 matched-level listening example
        run: python scripts/render_m24_1_listening_example.py --output /tmp/reawarp-m24-1-listening
      - name: Benchmark portable M24.2 spectral delay
        run: python scripts/benchmark_m24_2_spectral_delay.py --duration 0.15 --sample-rate 22050 --output /tmp/reawarp-m24-2-benchmark.json
      - name: Render M24.2 matched-level listening example
        run: python scripts/render_m24_2_listening_example.py --output /tmp/reawarp-m24-2-listening --sample-rate 22050
      - name: Benchmark portable M24.3 cross-synthesis
        run: python scripts/benchmark_m24_3_cross_synthesis.py --duration 0.15 --sample-rate 22050 --output /tmp/reawarp-m24-3-benchmark.json
      - name: Render M24.3 listening example
        run: python scripts/render_m24_3_listening_example.py --output /tmp/reawarp-m24-3-listening --sample-rate 22050
      - name: Benchmark portable M24.4 oversampled nonlinear processing
        run: python scripts/benchmark_m24_4_nonlinear.py --duration 0.15 --sample-rate 22050 --output /tmp/reawarp-m24-4-benchmark.json
      - name: Render M24.4 nonlinear listening example
        run: python scripts/render_m24_4_listening_example.py --output /tmp/reawarp-m24-4-listening --sample-rate 22050
      - name: Benchmark portable M24.6 feedback network
        run: python scripts/benchmark_m24_6_feedback_network.py --duration 0.15 --sample-rate 22050 --output /tmp/reawarp-m24-6-benchmark.json
      - name: Render M24.6 feedback-network listening example
        run: python scripts/render_m24_6_listening_example.py --output /tmp/reawarp-m24-6-listening --sample-rate 22050
      - name: Smoke-test M25 manifest, asset portability and archive reopen
        run: python scripts/benchmark_m25.py --durations 5 --sample-rate 48000 --output /tmp/reawarp-m25-smoke.json
      - name: Smoke-test CLI
        run: reawarp --duration 5 --sample-rate 22050 --seed 211 --output /tmp/reawarp-ci
      - name: Smoke-test FX preset and stage registries
        run: |
          reawarp-fx --list-presets
          reawarp-fx --list-stages
      - name: Validate a portable custom FX chain
        run: |
          python -c "import json; from pathlib import Path; Path('/tmp/reawarp-chain.json').write_text(json.dumps({'schema_version': 1, 'name': 'CI chain', 'stages': [{'type': 'highpass', 'cutoff_hz': 42.0, 'mix': 0.8}]}))"
          reawarp-fx --validate-chain-json /tmp/reawarp-chain.json
      - name: Validate role-aware FX routing without Pyo
        run: |
          python - <<'PY'
          import json
          import numpy as np
          from pathlib import Path
          from reawarp.fx_routing import default_fx_routing, save_fx_routing, load_fx_routing, render_fx_routing
          project = json.loads(Path('/tmp/reawarp-ci/project.json').read_text(encoding='utf-8'))
          names = project['stems']
          frames = project['frame_count']
          sample_rate = project['sample_rate']
          dry = {name: np.zeros((frames, 2), dtype=np.float32) for name in names}
          before = {name: audio.copy() for name, audio in dry.items()}
          routing = default_fx_routing(names)
          rendered, metadata = render_fx_routing(dry, sample_rate, routing)
          assert all(np.array_equal(rendered[name], before[name]) for name in names)
          assert all(np.array_equal(dry[name], before[name]) for name in names)
          assert not metadata['rendered_returns']
          path = Path('/tmp/reawarp-routing.json')
          save_fx_routing(path, routing, names, sample_rate)
          loaded = load_fx_routing(path, names, sample_rate)
          assert loaded['schema_version'] == 4
          print(f'Routing schema OK · {len(names)} stems · dry source preserved')
          PY
          reawarp-routing /tmp/reawarp-ci --routing /tmp/reawarp-routing.json --validate
      - name: Validate beat-based FX automation without Pyo
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from reawarp.fx_automation import (
              automation_envelope, load_fx_automation, normalise_fx_automation,
              save_fx_automation,
          )
          from reawarp.fx_routing import build_role_audition_matrix, normalise_fx_routing
          project = json.loads(Path('/tmp/reawarp-ci/project.json').read_text(encoding='utf-8'))
          stem = project['stems'][0]
          payload = {
              'schema_version': 1,
              'lanes': {
                  f'stem.{stem}.send.space': [
                      {'beat': 0, 'value': 0.0, 'curve': 'smooth'},
                      {'beat': 1, 'value': 0.5, 'curve': 'linear'},
                      {'beat': 2, 'value': 0.0, 'curve': 'hold'},
                  ]
              },
          }
          automation = normalise_fx_automation(payload, project['stems'])
          envelope = automation_envelope(
              automation['lanes'][f'stem.{stem}.send.space'],
              frames=2001, sample_rate=1000, bpm=120, default_value=0.0,
          )
          assert envelope[0] == 0.0
          assert 0.20 < float(envelope[250]) < 0.30
          assert abs(float(envelope[500]) - 0.5) < 1e-6
          assert float(envelope[1000]) == 0.0
          path = Path('/tmp/reawarp-automation.json')
          save_fx_automation(path, automation, project['stems'])
          loaded = load_fx_automation(path, project['stems'])
          assert loaded == automation
          matrix = build_role_audition_matrix(project['stems'])
          assert set(matrix) == {'percussion_focus', 'melody_foreground', 'ambience_background', 'combined_roles'}
          for profile in matrix.values():
              normalise_fx_routing(profile, project['stems'], project['sample_rate'])
          print('Beat automation and role audition profiles OK')
          PY
          reawarp-routing /tmp/reawarp-ci --routing /tmp/reawarp-routing.json --automation /tmp/reawarp-automation.json --validate
          reawarp-routing /tmp/reawarp-ci --audition-matrix --validate
      - name: Check role-aware signal flow with a deterministic FX stand-in
        run: |
          python - <<'PY'
          import numpy as np
          import reawarp.fx_routing as fx
          from reawarp.fx_routing import default_fx_routing, render_fx_routing, render_master_with_returns
          sample_rate = 1000
          frames = 4000
          time = np.arange(frames, dtype=np.float32) / sample_rate
          dry = {
              'kick': np.zeros((frames, 2), dtype=np.float32),
              'snare': np.zeros((frames, 2), dtype=np.float32),
              'melody': np.column_stack((0.06 * np.sin(2 * np.pi * 110 * time),) * 2).astype(np.float32),
              'ambience': np.column_stack((0.02 * np.sin(2 * np.pi * 55 * time),) * 2).astype(np.float32),
          }
          dry['kick'][::400] = 0.18
          dry['snare'][100::400] = 0.08
          original = {name: audio.copy() for name, audio in dry.items()}
          routing = default_fx_routing(tuple(dry))
          routing['stems']['melody']['insert'] = {
              'kind': 'preset', 'preset': 'restrained_space', 'wet': 0.18, 'tail_seconds': 0.10
          }
          routing['stems']['melody']['sends'] = {'space': 0.08, 'echo': 0.03}
          routing['stems']['ambience']['sends'] = {'space': 0.12, 'echo': 0.0}
          routing['buses']['space'].update({'wet': 0.15, 'tail_seconds': 0.20})
          routing['buses']['echo'].update({'wet': 0.10, 'tail_seconds': 0.10, 'delay_sync': '1/8'})
          automation = {
              'schema_version': 1,
              'lanes': {
                  'stem.melody.send.space': [
                      {'beat': 0, 'value': 0.04, 'curve': 'smooth'},
                      {'beat': 8, 'value': 0.08, 'curve': 'hold'},
                  ],
                  'bus.space.wet': [
                      {'beat': 0, 'value': 0.10, 'curve': 'linear'},
                      {'beat': 8, 'value': 0.15, 'curve': 'hold'},
                  ],
              },
          }
          captured = {}
          def deterministic_fx(audio, sr, *, preset=None, stages=None, wet=1.0, tail_seconds=0.0):
              source = np.asarray(audio, dtype=np.float32)
              if source.ndim == 1:
                  source = source[:, None]
              for stage in stages or ():
                  if stage.get('type') == 'delay':
                      captured['delay_seconds'] = float(stage['delay_seconds'])
              tail = int(round(tail_seconds * sr))
              result = np.zeros((len(source) + tail, source.shape[1]), dtype=np.float32)
              result[:len(source)] = source * 0.72
              if tail and len(source):
                  decay = np.linspace(0.10, 0.0, tail, dtype=np.float32)[:, None]
                  result[len(source):] = source[-1:] * decay
              return result
          fx.render_pyo_fx = deterministic_fx
          processed, metadata = render_fx_routing(
              dry, sample_rate, routing, bpm=120, automation=automation
          )
          returns = metadata.pop('bus_returns_audio')
          assert all(audio.ndim == 2 and audio.shape[1] == 2 and len(audio) >= frames for audio in processed.values())
          assert all(np.array_equal(dry[name], original[name]) for name in dry)
          assert set(returns) == {'space', 'echo'}
          assert metadata['active_send_stems_by_bus']['space'] == ['melody', 'ambience']
          assert abs(captured['delay_seconds'] - 0.25) < 1e-9
          direct = sum(float(np.sqrt(np.mean(audio ** 2))) for audio in processed.values())
          returned = sum(float(np.sqrt(np.mean(audio ** 2))) for audio in returns.values())
          assert 0.0 < returned < direct
          master = render_master_with_returns(processed, returns)
          assert len(master) > frames
          print(f'Role routing OK · return/direct RMS sum ratio {returned / direct:.3f} · 1/8 at 120 BPM = 0.25 s')
          PY
      - name: Smoke-test local library CLI
        run: |
          reawarp-library --db /tmp/reawarp-library.sqlite3 index samples/13_cymbal1_606.wav
          reawarp-library --db /tmp/reawarp-library.sqlite3 search --role sample
      - name: Smoke-test desktop entry point
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -c "from PySide6.QtWidgets import QApplication; from reawarp.ui.main_window import MainWindow; app=QApplication([]); window=MainWindow(); assert window.tabs.count() == 10, 'workspace stack count'; assert window.navigator.workspace_count() == 10, 'navigator workspace count'; assert window.arrangement_page is not None, 'M33 Arrangement workspace'; assert window.attention_map_page is not None, 'M29 Attention Map workspace'; assert window.sound_object_page is not None, 'M31 Sound Object Workshop workspace'; assert window.sample_selectors['kick'].count() >= 2, 'kick sample catalog'; assert window.sample_selectors['snare'].count() >= 2, 'snare sample catalog'; assert window.library_page.use_generator_button.isEnabled(), 'Library send-to-Generator action'; assert window.library_page.bundled_button.isEnabled(), 'bundled sample browser action'; window.library_page.role.setCurrentText('kick'); window.library_page.bundled_button.click(); assert window.library_page.results.count() >= 1, 'bundled sample browser results'; window.library_page.use_generator_button.click(); assert window.sample_selectors['kick'].currentData() is not None, 'Library-to-Generator source bridge'; assert window.generate_button.isEnabled(), 'Generate action enabled'; assert window.generate_button.parentWidget().objectName() == 'generatorActionBar', 'Generate action in global action bar'; assert window.drum_sample_automation.count() == 4, 'drum sample automation modes'; assert window.percussion_hybrid_architecture.findData('feature_guided') >= 0, 'feature-guided hybrid architecture'; assert window.auto_drum_sample_switching.isChecked(), 'automatic drum sample switching enabled'; generated_config = window._read_config(); assert len(generated_config.sample_banks['kick']) >= 2, 'Generator builds a kick sample bank'; assert generated_config.sample_banks['kick'][0]['path'] == generated_config.sample_paths['kick'], 'selected kick remains the opening anchor'; window.show(); app.processEvents(); assert window.generate_button.isVisible(), 'Generate action visible on Generator workspace'; window.navigator.register_group(('COMPOSE', 'GENERATOR', 'ADVANCED')); assert window.navigator.topLevelItemCount() == 3, 'navigator group registration'; assert window.mixer_stack.currentIndex() == 0, 'mixer empty state'; assert window.preview.waveform_stack.currentWidget() is window.preview.waveform_empty, 'empty waveform placeholder'; window.preview.set_audio([0.0, 0.1], 48000); assert window.preview.waveform_stack.currentWidget() is window.preview.waveform, 'waveform preview'; window.preview.set_audio(None); assert window.fx_lab_page.stage_list.count() == 3, 'FX stage catalogue'; assert window.fx_routing_editor.stem.count() == 0, 'FX routing empty state'; assert window.fx_automation_editor.lane.count() == 0, 'FX automation empty state'; assert window.fx_workspace_tabs.count() == 3, 'FX routing, FX automation and Score Control tabs'; window._set_workspace(2); assert window.workspace_stack.currentIndex() == 2, 'mixer navigation'; assert window.arrangement_density.value() == 0.55, 'independent arrangement density control'; assert window.rhythmic_syncopation.value() == 0.52, 'independent syncopation control'; assert window.arrangement_instability.value() == 0.40, 'independent instability control'; assert window.melodic_activity.value() == 0.62, 'independent melodic activity control'; assert window.melody_register_semitones.value() == 0, 'motif register control'; assert window.tonal_brightness.value() == 0.55, 'independent brightness control'; assert window.spatial_intent.value() == 0.52, 'independent spatial intent control'; window._set_workspace(0); window.close(); app.processEvents(); print('Reawarp grouped navigation, M15 composition axes, FX workspaces and M18 Score Control OK')"

  windows-regression:
    name: Windows regression
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and quality dependencies
        run: python -m pip install -e ".[dev,audio,m4,midi]"
      - name: Compile application package
        run: python -m compileall -q src/reawarp
      - name: Run regression suite
        run: python -m pytest -q
      - name: Smoke-test M25 archive manifest and 48 kHz export/reopen
        run: python scripts/benchmark_m25.py --durations 5 --sample-rate 48000 --output reawarp-m25-windows-smoke.json
      - name: Smoke-test Windows CLI and benchmark
        run: |
          reawarp --duration 5 --sample-rate 22050 --seed 211 --output reawarp-windows-ci
          python scripts/benchmark_generation.py --durations 5 --palettes subtractive --sample-rate 22050 --output reawarp-windows-benchmark.json
